[package]
name = "nana-ui-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Backend-neutral NanaUI design tokens, workspace contracts, and component semantics"
license = "MIT OR Apache-2.0"

[lib]
name = "nana_ui_core"
path = "src/lib.rs"

[features]
default = []
# The bundled Noto Sans SC variable face (~4.4 MB, `wght` 400..700, default
# Regular), as bytes: for tests and benchmarks that build a font set of their
# own. No drawing path reads it directly; what is drawn with is whatever the
# host's font set holds.
bundled-font-regular = []
# The same face as the theme's UI font set (`ui_font_sources`), which desktop
# theme hosts register with the text engine; embeds nothing more. The Android
# host deliberately does not.
bundled-fonts = ["bundled-font-regular"]

[dependencies]
nana-diagnostics = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
